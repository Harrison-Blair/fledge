name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          status=0
          go test -trimpath -buildvcs=true -race -covermode=atomic -coverprofile=coverage.out ./... || status=$?
          if [ -f coverage.out ]; then
            {
              echo "## Test coverage"
              echo
              go tool cover -func=coverage.out | awk '/^total:/ {print "Total: **" $3 "**"}'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
