name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check the tag against VERSION
        id: version
        run: |
          file="$(< VERSION)"
          file="${file#"${file%%[![:space:]]*}"}"
          file="${file%"${file##*[![:space:]]}"}"
          tag="${GITHUB_REF_NAME#v}"
          [ "$file" = "$tag" ] || { echo "VERSION=$file disagrees with tag $GITHUB_REF_NAME"; exit 1; }
          echo "version=$file" >> "$GITHUB_OUTPUT"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p dist stage
          for goarch in amd64 arm64; do
            name="fledge_${VERSION}_linux_${goarch}"
            mkdir -p "stage/$name"
            cp LICENSE README.md "stage/$name/"
            GOARCH="$goarch" go build -trimpath -buildvcs=true -o "stage/$name/fledge" .
            tar -czf "dist/$name.tar.gz" -C stage "$name"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./dist/*
