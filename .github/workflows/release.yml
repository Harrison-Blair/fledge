name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check the tag against VERSION
        id: version
        run: |
          file="$(< VERSION)"
          file="${file#"${file%%[![:space:]]*}"}"
          file="${file%"${file##*[![:space:]]}"}"
          tag="${GITHUB_REF_NAME#v}"
          [ "$file" = "$tag" ] || { echo "VERSION=$file disagrees with tag $GITHUB_REF_NAME"; exit 1; }
          echo "version=$file" >> "$GITHUB_OUTPUT"
      - name: Check that the release version is monotonic
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'invalid release version %q: expected vMAJOR.MINOR.PATCH\n' "$tag" >&2
            exit 1
          fi
          while IFS= read -r existing_tag; do
            [[ "$existing_tag" == "$tag" ]] && continue
            [[ "$existing_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            highest="$(printf '%s\n%s\n' "$existing_tag" "$tag" | sort -V | tail -n 1)"
            if [[ "$highest" != "$tag" ]]; then
              printf 'release %s is not newer than existing release %s\n' "$tag" "$existing_tag" >&2
              exit 1
            fi
          done < <(git tag --list)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p dist stage
          for goarch in amd64 arm64; do
            name="fledge_${VERSION}_linux_${goarch}"
            mkdir -p "stage/$name"
            cp LICENSE README.md "stage/$name/"
            GOARCH="$goarch" go build -trimpath -buildvcs=true -o "stage/$name/fledge" .
            tar -czf "dist/$name.tar.gz" -C stage "$name"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./dist/*
