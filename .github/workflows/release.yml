name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  safety-net:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  detect-version:
    name: Detect VERSION change
    needs: safety-net
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compare VERSION to previous commit
        id: check
        run: |
          current="$(cat VERSION)"
          previous="$(git show HEAD^:VERSION 2>/dev/null || echo '')"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X github.com/Harrison-Blair/fledge/internal/cli.binaryVersion=$VERSION" \
            -o dist/fledge ./cmd/fledge
      - name: Package archive
        run: |
          cd dist
          name="fledge_${{ matrix.goos }}_${{ matrix.goarch }}"
          tar -czf "$name.tar.gz" fledge
          sha256sum "$name.tar.gz" > checksums.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/fledge_*
            dist/checksums.txt

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Merge checksums
        run: |
          cd dist
          cat checksums.txt > combined-checksums.txt
          rm checksums.txt
          mv combined-checksums.txt checksums.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --generate-notes \
            dist/fledge_linux_amd64.tar.gz \
            dist/fledge_linux_arm64.tar.gz \
            dist/fledge_darwin_amd64.tar.gz \
            dist/fledge_darwin_arm64.tar.gz \
            dist/checksums.txt
