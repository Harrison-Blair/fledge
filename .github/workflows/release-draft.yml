name: Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to draft, without the v prefix (for example, 0.0.3)
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.validate.outputs.skip }}
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate version and release state
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch is a deliberate manual release request: every
          # check is fatal. A push (a merge into main) refreshes the draft
          # opportunistically, so a state that is merely "not a new, unreleased
          # version" skips silently (exit 0) instead of failing the run.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            strict=true
          else
            strict=false
          fi

          file_version="$(< internal/version/VERSION)"
          file_version="${file_version#"${file_version%%[![:space:]]*}"}"
          file_version="${file_version%"${file_version##*[![:space:]]}"}"

          # On push the version comes from the file; on dispatch it comes from
          # the input (still validated against the file below).
          if [[ "$strict" == "true" ]]; then
            requested_version="$REQUESTED_VERSION"
          else
            requested_version="$file_version"
          fi

          finish_skip() {
            local reason="$1"
            echo "Release draft skipped: $reason"
            {
              echo "skip=true"
              echo "version=$requested_version"
              echo "tag=v$requested_version"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Release draft skipped"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Fatal on workflow_dispatch; a silent skip on push.
          guard() {
            if [[ "$strict" == "true" ]]; then
              echo "$1" >&2
              exit 1
            fi
            finish_skip "$1"
          }

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            guard "Release drafts must be started from the main branch; got $GITHUB_REF."
          fi

          if [[ ! "$requested_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            guard "Invalid version '$requested_version': expected MAJOR.MINOR.PATCH without a v prefix."
          fi

          # On push requested_version is the file version, so this only guards
          # the manual path where the input can drift from the file.
          if [[ "$strict" == "true" && "$requested_version" != "$file_version" ]]; then
            echo "Requested version $requested_version does not match internal/version/VERSION ($file_version)." >&2
            exit 1
          fi

          tag="v$requested_version"
          export TAG="$tag"

          while IFS= read -r existing_tag; do
            [[ "$existing_tag" == "$tag" ]] && continue
            [[ "$existing_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            highest="$(printf '%s\n%s\n' "$existing_tag" "$tag" | sort -V | tail -n 1)"
            if [[ "$highest" != "$tag" ]]; then
              guard "$tag is not newer than existing version $existing_tag."
            fi
          done < <(git tag --list)

          release_info="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | [.id, .draft, .html_url] | @tsv'
          )"

          if [[ "$release_info" == *$'\n'* ]]; then
            guard "Multiple GitHub releases use $tag; resolve the conflict manually."
          fi

          if [[ -n "$release_info" ]]; then
            IFS=$'\t' read -r _ is_draft release_url <<< "$release_info"
            if [[ "$is_draft" != "true" ]]; then
              guard "$tag is already published: $release_url"
            fi
            echo "An existing draft for $tag will be refreshed after CI passes."
          elif git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$TARGET_SHA" ]]; then
              # A bare tag on a different commit with no published release is
              # still refreshable: the draft job re-points it. On dispatch this
              # is treated as a strict consistency failure instead.
              if [[ "$strict" == "true" ]]; then
                echo "$tag already marks commit $tag_sha instead of current main commit $TARGET_SHA." >&2
                exit 1
              fi
              echo "$tag currently marks $tag_sha; it will be re-pointed to $TARGET_SHA while drafting."
            else
              echo "$tag already marks the current main commit and will be used for the draft."
            fi
          fi

          {
            echo "skip=false"
            echo "version=$requested_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test:
    name: Test
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  draft:
    name: Create or refresh draft
    needs: [preflight, lint, test, build]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.preflight.outputs.tag }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create or refresh release draft
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_info="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | [.id, .draft, .html_url] | @tsv'
          )"

          if [[ "$release_info" == *$'\n'* ]]; then
            echo "Multiple GitHub releases use $TAG; resolve the conflict manually." >&2
            exit 1
          fi

          if [[ -n "$release_info" ]]; then
            IFS=$'\t' read -r release_id is_draft release_url <<< "$release_info"
            if [[ "$is_draft" != "true" ]]; then
              echo "$TAG was published while CI was running: $release_url" >&2
              exit 1
            fi

            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              tag_sha="$(git rev-list -n 1 "$TAG")"
              if [[ "$tag_sha" != "$TARGET_SHA" ]]; then
                git tag --force "$TAG" "$TARGET_SHA"
                git push --force origin "refs/tags/$TAG"
              fi
            else
              git tag "$TAG" "$TARGET_SHA"
              git push origin "refs/tags/$TAG"
            fi

            notes_json="$RUNNER_TEMP/release-notes.json"
            update_json="$RUNNER_TEMP/release-update.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              --raw-field tag_name="$TAG" \
              --raw-field target_commitish="$TARGET_SHA" > "$notes_json"
            jq --arg tag "$TAG" --arg target "$TARGET_SHA" \
              '{tag_name: $tag, target_commitish: $target, name: .name, body: .body, draft: true, prerelease: false}' \
              "$notes_json" > "$update_json"
            release_url="$(
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                --input "$update_json" --jq '.html_url'
            )"
          else
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              tag_sha="$(git rev-list -n 1 "$TAG")"
              if [[ "$tag_sha" != "$TARGET_SHA" ]]; then
                # A moved tag mid-run is a race on the manual path (fail), but
                # on push a pre-existing bare tag is simply re-pointed to head.
                if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                  echo "$TAG changed while CI was running and no longer marks $TARGET_SHA." >&2
                  exit 1
                fi
                git tag --force "$TAG" "$TARGET_SHA"
                git push --force origin "refs/tags/$TAG"
              fi
              release_url="$(gh release create "$TAG" --verify-tag --generate-notes --draft)"
            else
              release_url="$(gh release create "$TAG" --target "$TARGET_SHA" --generate-notes --draft)"
            fi
          fi

          echo "url=$release_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Release draft"
            echo
            echo "Draft [$TAG]($release_url) is ready for review."
          } >> "$GITHUB_STEP_SUMMARY"
